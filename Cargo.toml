[workspace]
members = ["crates/pathweft-core", "crates/pathweft-node", "crates/pathweft-cli", "crates/pathweft-android", "crates/pathweft-ble"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
