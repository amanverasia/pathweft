[package]
name = "pathweft"
description = "Experimental desktop Pathweft node and command-line client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
pathweft-core = { path = "../pathweft-core" }
pathweft-node = { path = "../pathweft-node" }
qrcode = { version = "=0.14.1", default-features = false }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
uuid.workspace = true

[dev-dependencies]
rqrr = "=0.11.0"
